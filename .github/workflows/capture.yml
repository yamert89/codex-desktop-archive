name: Capture ChatGPT Linux DEB

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: chatgpt-linux-deb-capture
  cancel-in-progress: false

env:
  DEB_AMD64_URL: https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb
  DEB_ARM64_URL: https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_arm64.deb

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        run: |
          bash -n scripts/capture_source.sh
          bash -n scripts/publish_release.sh
          bash -n scripts/verify_existing_release.sh

      - name: Check Python syntax
        run: python3 -m py_compile scripts/inspect_deb.py scripts/make_manifest.py scripts/render_release_notes.py scripts/should_release.py scripts/release_guard.py

  capture-deb:
    name: Capture ChatGPT Linux DEB packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download official ChatGPT Linux DEB artifacts
        run: |
          ./scripts/capture_source.sh amd64 "$DEB_AMD64_URL" artifacts/chatgpt_amd64.deb out/deb-amd64-source.json
          ./scripts/capture_source.sh arm64 "$DEB_ARM64_URL" artifacts/chatgpt_arm64.deb out/deb-arm64-source.json

      - name: Inspect Linux DEB packages
        run: |
          python3 scripts/inspect_deb.py artifacts/chatgpt_amd64.deb out/deb-amd64-inspection.json --architecture amd64
          python3 scripts/inspect_deb.py artifacts/chatgpt_arm64.deb out/deb-arm64-inspection.json --architecture arm64

      - name: Upload Linux DEB capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capture-deb
          retention-days: 3
          path: |
            artifacts/chatgpt_amd64.deb
            artifacts/chatgpt_arm64.deb
            out/deb-amd64-source.json
            out/deb-arm64-source.json
            out/deb-amd64-inspection.json
            out/deb-arm64-inspection.json

  verify-release:
    name: Verify release package
    needs: capture-deb
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decision.outputs.should_release }}
      tag: ${{ steps.decision.outputs.tag }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download captured artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Re-inspect Linux DEB packages before publication
        run: |
          python3 scripts/inspect_deb.py dist/artifacts/chatgpt_amd64.deb out/publish-deb-amd64-inspection.json --architecture amd64
          python3 scripts/inspect_deb.py dist/artifacts/chatgpt_arm64.deb out/publish-deb-arm64-inspection.json --architecture arm64

      - name: Build and validate candidate manifest
        run: |
          python3 scripts/make_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-sha "$GITHUB_SHA" \
            --deb-artifact dist/artifacts/chatgpt_amd64.deb \
            --deb-source dist/out/deb-amd64-source.json \
            --deb-inspection out/publish-deb-amd64-inspection.json \
            --deb-artifact dist/artifacts/chatgpt_arm64.deb \
            --deb-source dist/out/deb-arm64-source.json \
            --deb-inspection out/publish-deb-arm64-inspection.json \
            --output out/candidate-manifest.json

          python3 scripts/release_guard.py validate-manifest --manifest out/candidate-manifest.json

      - name: Decide whether to release
        id: decision
        run: |
          python3 scripts/should_release.py \
            --latest manifest/latest.json \
            --candidate out/candidate-manifest.json \
            --output out/release-decision.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          decision = json.loads(Path("out/release-decision.json").read_text(encoding="utf-8"))
          print(f"should_release={str(decision['should_release']).lower()}")
          print(f"tag={decision['tag']}")
          print(f"reason={decision['reason']}")
          PY

      - name: Verify existing release when capture is unchanged
        if: steps.decision.outputs.should_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/render_release_notes.py \
            --manifest manifest/latest.json \
            --output out/latest-release-notes.md
          ./scripts/verify_existing_release.sh manifest/latest.json out/latest-release-notes.md
          echo "No release created: ${{ steps.decision.outputs.reason }}. Existing release verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release package
        if: steps.decision.outputs.should_release == 'true'
        run: |
          python3 scripts/render_release_notes.py \
            --manifest out/candidate-manifest.json \
            --output out/release-notes.md

          version="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("out/candidate-manifest.json").read_text(encoding="utf-8"))
          print(manifest["release"]["identity"]["version"])
          PY
          )"

          mkdir -p release-package/release-assets
          cp dist/artifacts/chatgpt_amd64.deb "release-package/release-assets/ChatGPT-Desktop-${version}-linux-amd64.deb"
          cp dist/artifacts/chatgpt_arm64.deb "release-package/release-assets/ChatGPT-Desktop-${version}-linux-arm64.deb"
          cp out/candidate-manifest.json release-package/candidate-manifest.json
          cp out/release-notes.md release-package/release-notes.md
          python3 scripts/release_guard.py verify-assets \
            --manifest out/candidate-manifest.json \
            --asset-dir release-package/release-assets

      - name: Upload release package
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package
          retention-days: 3
          path: release-package

  publish:
    name: Publish verified release
    needs: verify-release
    if: needs.verify-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package
          path: release-package

      - name: Re-inspect Linux DEB packages before final publication
        run: |
          amd64_asset="$(find release-package/release-assets -maxdepth 1 -name 'ChatGPT-Desktop-*-linux-amd64.deb' -print -quit)"
          arm64_asset="$(find release-package/release-assets -maxdepth 1 -name 'ChatGPT-Desktop-*-linux-arm64.deb' -print -quit)"
          python3 scripts/inspect_deb.py "$amd64_asset" out/final-publish-deb-amd64-inspection.json --architecture amd64
          python3 scripts/inspect_deb.py "$arm64_asset" out/final-publish-deb-arm64-inspection.json --architecture arm64
          python3 scripts/release_guard.py verify-local-artifact \
            --manifest release-package/candidate-manifest.json \
            --artifact "$amd64_asset" \
            --inspection out/final-publish-deb-amd64-inspection.json
          python3 scripts/release_guard.py verify-local-artifact \
            --manifest release-package/candidate-manifest.json \
            --artifact "$arm64_asset" \
            --inspection out/final-publish-deb-arm64-inspection.json

      - name: Publish release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          amd64_asset="$(find release-package/release-assets -maxdepth 1 -name 'ChatGPT-Desktop-*-linux-amd64.deb' -print -quit)"
          arm64_asset="$(find release-package/release-assets -maxdepth 1 -name 'ChatGPT-Desktop-*-linux-arm64.deb' -print -quit)"
          ./scripts/publish_release.sh \
            release-package/candidate-manifest.json \
            release-package/release-notes.md \
            "$amd64_asset" \
            "$arm64_asset" \
            out/final-publish-deb-amd64-inspection.json \
            out/final-publish-deb-arm64-inspection.json
